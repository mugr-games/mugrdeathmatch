# Publishes the game page to GitHub Pages (https://<user>.github.io/<repo>) on every push to main.
# Needs: Settings → Pages → Source "GitHub Actions", and a repository variable GAME_SERVER_URL holding the
# online game server's address (for example the Koyeb URL).
name: Publish the game page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the page
        env:
          GAME_SERVER_URL: ${{ vars.GAME_SERVER_URL }}
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
        run: node tools/build_pages.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
